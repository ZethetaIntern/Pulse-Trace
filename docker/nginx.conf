# =============================================================================
# PulseTrace — Nginx Configuration
# =============================================================================
#
# Serves the React dashboard SPA and reverse-proxies API requests
# to the backend API container.
#
# Routes:
#   /api/*          → http://api:4000/api/*
#   /health         → http://api:4000/health
#   /health/ready   → http://api:4000/health/ready
#   /assets/*       → Static files with immutable cache headers
#   /*              → SPA fallback (index.html for client-side routing)
# =============================================================================

upstream api_server {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # --- API reverse proxy ---
    # All /api/ requests are forwarded to the Express backend.
    location /api/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for potentially long-running API calls
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Health endpoint proxy (exact match) ---
    # Exact match prevents this from catching SPA routes or partial matches.
    location = /health {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Readiness endpoint proxy (exact match) ---
    location = /health/ready {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Static assets with immutable caching ---
    # Vite produces hashed filenames (e.g. index-C9TskOiV.js), so these
    # can be cached aggressively — a new hash means a new file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback ---
    # Must come AFTER specific location blocks.
    # For any route that doesn't match a static file, serve index.html
    # so React Router can handle client-side routing.
    #
    # Supported routes:
    #   /                       → OverviewPage
    #   /notifications           → NotificationsPage
    #   /notifications/:id       → NotificationDetailPage
    #   /analytics               → AnalyticsPage
    #   /monitoring              → MonitoringPage
    location / {
        try_files $uri $uri/ /index.html;
    }
}
